name: Build Flutter Android

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter_build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'pubspec.yaml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Increment build number
        run: |
          # Increment build number using github.run_number
          # Offset by 100 to ensure it's higher than existing build numbers
          BUILD_NUMBER=$((200 + ${{ github.run_number }}))
          sed -i "s/version: \(.*\)+.*/version: \1+$BUILD_NUMBER/" pubspec.yaml
          echo "New Version: $(grep 'version:' pubspec.yaml)"

      - name: Analyze code (Non-fatal)
        run: flutter analyze || echo "Analysis found issues but continuing with build"

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Setup Signing
        run: |
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=ruby-release-key.jks" >> android/key.properties
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/ruby-release-key.jks

      - name: Build appbundle (Release)
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bakiza-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload AppBundle
        uses: actions/upload-artifact@v4
        with:
          name: bakiza-appbundle
          path: build/app/outputs/bundle/release/*.aab

      - name: Deploy to Play Store (Internal Testing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.engseif.ruby
          releaseFiles: build/app/outputs/bundle/release/*.aab
          track: internal
          status: completed
