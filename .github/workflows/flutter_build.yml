name: Build Flutter Android

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter_build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'pubspec.yaml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (Non-fatal)
        run: flutter analyze || echo "Analysis found issues but continuing with build"

      - name: Build APK (Release)
        run: flutter build apk --release --no-daemon

      - name: Build appbundle (Release)
        run: flutter build appbundle --release --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bakiza-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload AppBundle
        uses: actions/upload-artifact@v4
        with:
          name: bakiza-appbundle
          path: build/app/outputs/bundle/release/*.aab
