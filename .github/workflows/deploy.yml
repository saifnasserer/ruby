name: Deploy Webapp to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'webapp/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Webapp
        uses: docker/build-push-action@v5
        with:
          context: ./webapp
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bakiza-webapp:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/bakiza-webapp:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/bakiza-webapp:buildcache,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 1. Ensure project directory exists
            mkdir -p /home/deploy/laapak-projects/bakiza/webapp
            cd /home/deploy/laapak-projects/bakiza

            # 2. Create docker-compose.yml
            cat << 'COMPOSE' > docker-compose.yml
            version: '3.8'

            services:
              bakiza-webapp:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/bakiza-webapp:latest
                container_name: bakiza-webapp
                restart: unless-stopped
                ports:
                  - "3007:80"
                networks:
                  - nginx_network

            networks:
              nginx_network:
                external: true
                name: docker-infra_nginx_network
            COMPOSE

            # 3. Pull latest image and restart
            docker compose pull bakiza-webapp
            docker compose up -d bakiza-webapp

            # 4. Clean up old images
            docker image prune -f

            # 5. Reload Nginx Proxy (if applicable in the infra setup)
            docker exec nginx-proxy nginx -s reload || echo "Nginx proxy reload skipped or failed"
